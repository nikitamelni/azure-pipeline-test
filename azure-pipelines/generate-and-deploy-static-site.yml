# Node.js
# Build a general Node.js project with npm.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript
                
trigger: none

variables:
  RESOURCE_GROUP: 'dev-nikitam-eastus-rg'
  PROFILE_NAME: 'nikitam-fd'
  ENDPOINT_DOMAIN: 'pfg-uniform-g8bxgge7aqhwb2by.z01.azurefd.net'
  STORAGE_ACCOUNT_NAME: 'pfgpoc'
  CONTENT_PATHS: '["/*"]'  
  ENDPOINT_NAME: 'pfg-uniform'

pool:
  vmImage: ubuntu-latest

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '22.x'
  displayName: 'Install Node.js'

# ---------------------------------------------------------------------------
# Pre-flight mirror sync (DRAFT — disabled until the mirror Function exists)
#
# Once the mirror Azure Function is deployed, enable this step. It tells the
# mirror to fetch any routes it doesn't yet have from uniform.global before
# the build starts. This handles:
#   (a) Initial seed of an empty mirror after first deployment.
#   (b) New dynamic-route entries (e.g. a newly added location whose
#       /locations/<slug> URL was never invalidated because it didn't exist).
#
# The mirror Function exposes POST /api/sync with a JSON body of the form:
#   { "paths": ["/our-locations", "/locations/phoenix", ...] }
#
# The path list comes from a small script in this repo (TODO: add
# scripts/prefetch-routes.ts) that replicates the project-map + location-entry
# expansion currently done in src/pages/[[...slug]].tsx getStaticPaths.
#
# - task: AzureCLI@2
#   displayName: 'Pre-flight: sync mirror with discovered routes'
#   inputs:
#     azureSubscription: $(RESOURCE_GROUP)
#     scriptType: bash
#     scriptLocation: inlineScript
#     inlineScript: |
#       set -euo pipefail
#       node ./scripts/prefetch-routes.ts > /tmp/paths.json
#       curl -fsSL -X POST \
#         -H "Content-Type: application/json" \
#         --data-binary @/tmp/paths.json \
#         "${MIRROR_FUNCTION_BASE_URL}/api/sync?code=${MIRROR_FUNCTION_KEY}"
#   env:
#     UNIFORM_API_KEY: $(UNIFORM_API_KEY)
#     UNIFORM_PROJECT_ID: $(UNIFORM_PROJECT_ID)
#     MIRROR_FUNCTION_BASE_URL: $(MIRROR_FUNCTION_BASE_URL)
#     MIRROR_FUNCTION_KEY: $(MIRROR_FUNCTION_KEY)
# ---------------------------------------------------------------------------

- script: |
    npm ci
    npm run build
  displayName: 'npm install and build'
  env:
    UNIFORM_API_KEY: $(UNIFORM_API_KEY)
    UNIFORM_PROJECT_ID: $(UNIFORM_PROJECT_ID)
    RUNNING_MODE: 'build'
    # When the mirror Function is live, set UNIFORM_API_HOST in pipeline
    # variables to its base URL (including ?code=<function-key>). RouteClient
    # in src/pages/[[...slug]].tsx will route /api/v1/route calls there instead
    # of https://uniform.global. Leave empty/unset to keep using uniform.global.
    UNIFORM_API_HOST: $(UNIFORM_API_HOST)
    # Pin Next.js BUILD_ID to the commit SHA so static assets and _next/data
    # JSON paths are stable across rebuilds of the same content snapshot.
    BUILD_DEPLOY_ID: $(Build.SourceVersion)

- task: AzureCLI@2
  displayName: 'Upload site to $web'
  inputs:
    azureSubscription: $(RESOURCE_GROUP)   
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      az storage blob upload-batch \
        --account-name $(STORAGE_ACCOUNT_NAME) \
        --account-key "$STORAGE_KEY" \
        -s ./out \
        -d '$web' \
        --overwrite \
        --auth-mode key


- task: AzureCLI@2
  displayName: 'Purge Front Door CDN cache'
  inputs:
    azureSubscription: 'dev-nikitam-eastus-rg'     
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      set -euo pipefail
      echo "Running purge..."
      echo "RG=$RESOURCE_GROUP | PROFILE=$PROFILE_NAME | ENDPOINT=$ENDPOINT_NAME | DOMAINS=$ENDPOINT_DOMAIN | PATHS=$CONTENT_PATHS"
      az afd endpoint purge \
        --resource-group $RESOURCE_GROUP \
        --profile-name $PROFILE_NAME \
        --domains $ENDPOINT_DOMAIN \
        --content-paths $CONTENT_PATHS \
        --endpoint-name $ENDPOINT_NAME \
        --no-wait \
        --only-show-errors
      echo "Purge request submitted."